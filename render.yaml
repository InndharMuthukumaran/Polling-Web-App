services:
  - type: web
    name: polling-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TRUSTED_PROXY_COUNT
        value: 1
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
